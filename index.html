<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
</head>

<body>
    <h1>Прокат настольных игр</h1>
    <input type="checkbox" id="showMiss">
    <label for="showMiss">Показать только свободные</label>
    <p id="hunt"></p>
    <ul id="gameList"></ul>

    <label for="gameSelect">Игра</label>
    <select id="gameSelect">
    </select>

    <label for="borrowerName">Имя посетителя</label>
    <input id="borrowerName" type="text">
    <button id="borrowButton" type="button">Выдать</button>
    <button id="returnButton" type="button">Вернуть</button>
    <label for="newGame">Название игры</label>
    <input type="text" id="newGame">
    <label for="player">Количество игроков</label>
    <input type="text" id="player">
    <button id="new" type="button">Добавить игру</button>
    <p id="message"></p>
</body>

</html>
